<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDGERUNNERS // CALC</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>

  <!-- Mưa matrix Lucy × Rebecca -->
  <canvas id="rain"></canvas>
  <div id="scanlines"></div>

  <main>

    <!-- Tiêu đề -->
    <div class="panel">
      <div class="badges">
        <span class="badge badge-lucy">LUCY</span>
        <span class="badge badge-rebecca">REBECCA</span>
      </div>
      <h1 class="glitch" data-text="EDGERUNNERS">EDGERUNNERS</h1>
      <p style="text-align:center; font-size:0.65rem; color:rgba(0,255,255,0.3); letter-spacing:0.2em; margin-top:0.4rem;">
        // ARITHMETIC MODULE
      </p>
    </div>

    <!-- Form nhập -->
    <form method="POST" action="/" class="panel" style="display:flex; flex-direction:column; gap:1rem;">

      <div class="field">
        <label class="label-a">A</label>
        <input name="a" type="number" step="any"
               value="{{ a | default('') }}"
               placeholder="nhập số A" />
      </div>

      <div class="field">
        <label class="label-b">B</label>
        <input name="b" type="number" step="any"
               value="{{ b | default('') }}"
               placeholder="nhập số B" />
      </div>

      <button type="submit">[ OK — EXECUTE ]</button>

    </form>

    <!-- Kết quả -->
    {% if results %}
    <div class="panel">
      <p class="result-header">// OUTPUT STREAM</p>
      <table>
        <tbody>
          {% for name, expr, value, is_error in results %}
          <tr>
            <td class="col-name">{{ name }}</td>
            <td class="col-expr">{{ expr }}</td>
            <td class="{% if is_error %}col-error{% else %}col-value{% endif %}">{{ value }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% endif %}

  </main>

  <script>
    // ── Mưa matrix: ký tự Lucy × Rebecca ──────────────────
    const canvas = document.getElementById('rain');
    const ctx    = canvas.getContext('2d');

    const CHARS = 'ルシーレベッカ01アイウエオカキクケコ生死夢愛';
    const SIZE  = 15;
    // Lucy = tím, Rebecca = hồng
    const COLORS = ['#a78bfa', '#f472b6', '#c084fc', '#fb7185'];

    let cols, drops;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      cols  = Math.floor(canvas.width / SIZE);
      drops = Array.from({length: cols}, () => Math.floor(Math.random() * canvas.height / SIZE));
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
      ctx.fillStyle = 'rgba(4, 2, 15, 0.06)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = SIZE + 'px monospace';

      drops.forEach((y, i) => {
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fillText(CHARS[Math.floor(Math.random() * CHARS.length)], i * SIZE, y * SIZE);
        if (y * SIZE > canvas.height && Math.random() > 0.97) drops[i] = 0;
        drops[i]++;
      });
    }

    // Pre-render để trail có độ dài ngẫu nhiên ngay từ đầu
    for (let i = 0; i < 60; i++) draw();

    setInterval(draw, 40);
  </script>

</body>
</html>
